{% if composer %}
<form method="{{ composer.method }}" action="{{ composer.action_url }}" class="border-top pt-3 mt-3">
  {% csrf_token %}
  <label class="form-label small text-muted" for="messaging-reply-body">{{ composer.submit_label }}</label>
  <textarea id="messaging-reply-body"
            name="{{ composer.body_field_name }}"
            class="form-control"
            rows="4"
            placeholder="{{ composer.placeholder }}"
            {% if composer.disabled %}disabled{% endif %}></textarea>
  <div class="d-flex justify-content-end mt-2">
    <button type="submit" class="btn btn-primary btn-sm" {% if composer.disabled %}disabled{% endif %}>
      <i class="bi bi-send me-1"></i>{{ composer.submit_label }}
    </button>
  </div>
</form>
{% endif %}
